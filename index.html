<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whatnot Break Overlay</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .pokemon-card {
      position: relative;
      width: 300px;
    }

    .pokemon-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .spot-taken {
      position: absolute;
      top: 50%;
      left: -5%;
      width: 110%;
      transform: translateY(-50%) rotate(-7deg);
      padding: 14px 5px;
      background: rgba(190, 0, 0, 0.95);
      border-top: 4px solid white;
      border-bottom: 4px solid white;
      color: white;
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px black;
    }
  </style>
</head>

<body>
  <div class="pokemon-card">
    <img src="images/pokemon/N's Zoroark.png" alt="N's Zoroark">
    <div class="spot-taken">SPOT TAKEN</div>
  </div>
</body>
</html>
